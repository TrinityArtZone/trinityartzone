<!-- ================= SOCIAL MEDIA SECTION ================= -->

<style>
    .social-section {
        width: 100%;
        padding: 50px 20px;
        background: #f5f7fa;
        box-sizing: border-box;
    }

    .social-container {
        max-width: 1100px;
        margin: auto;
    }

    .social-title {
        text-align: center;
        margin-bottom: 30px;
    }

    .social-title h2 {
        margin: 0 0 10px;
        font-size: 32px;
        color: #222;
    }

    .social-title p {
        margin: 0;
        color: #777;
        font-size: 16px;
    }

    /* Horizontal boxes */
    .social-boxes {
        display: flex;
        gap: 20px;
        justify-content: center;
        align-items: stretch;
    }

    .social-box {
        flex: 1;
        min-width: 0;
        padding: 25px;
        border-radius: 15px;
        background: white;
        text-decoration: none;
        color: #222;
        display: flex;
        align-items: center;
        gap: 18px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        transition: 0.3s ease;
        cursor: pointer;
    }

    .social-box:hover {
        transform: translateY(-8px);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
    }

    /* Icon */
    .social-icon {
        width: 60px;
        height: 60px;
        min-width: 60px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 28px;
        font-weight: bold;
    }

    .youtube {
        background: #ff0000;
    }

    .instagram {
        background: linear-gradient(
            135deg,
            #833ab4,
            #fd1d1d,
            #fcb045
        );
    }

    .facebook {
        background: #1877f2;
    }

    .social-content h3 {
        margin: 0 0 6px;
        font-size: 20px;
    }

    .social-content p {
        margin: 0;
        color: #777;
        font-size: 14px;
    }

    .social-content span {
        display: inline-block;
        margin-top: 8px;
        font-size: 13px;
        font-weight: bold;
        color: #555;
    }

    /* Mobile responsive */
    @media (max-width: 768px) {
        .social-boxes {
            flex-direction: column;
        }

        .social-box {
            width: 100%;
        }

        .social-title h2 {
            font-size: 26px;
        }
    }
</style>


<section class="social-section">

    <div class="social-container">

        <div class="social-title">
            <h2>Follow Us</h2>
            <p>Stay connected with us on social media</p>
        </div>


        <div class="social-boxes">

            <!-- YouTube -->
            <a
                href="https://youtube.com/"
                target="_blank"
                class="social-box"
                data-platform="YouTube"
            >
                <div class="social-icon youtube">
                    ▶
                </div>

                <div class="social-content">
                    <h3>YouTube</h3>
                    <p>Watch our latest videos</p>
                    <span>Visit Channel →</span>
                </div>
            </a>


            <!-- Instagram -->
            <a
                href="https://www.instagram.com/trinityartzone/?hl=en"
                target="_blank"
                class="social-box"
                data-platform="Instagram"
            >
                <div class="social-icon instagram">
                    ◎
                </div>

                <div class="social-content">
                    <h3>Instagram</h3>
                    <p>See our latest updates</p>
                    <span>Follow Us →</span>
                </div>
            </a>


            <!-- Facebook -->
            <a
                href="https://www.instagram.com/trinityartzone/?hl=en"
                target="_blank"
                class="social-box"
                data-platform="Facebook"
            >
                <div class="social-icon facebook">
                    f
                </div>

                <div class="social-content">
                    <h3>Facebook</h3>
                    <p>Connect with our community</p>
                    <span>Like Our Page →</span>
                </div>
            </a>

        </div>

    </div>

</section>


<script>
    // Add a small click effect
    document.querySelectorAll(".social-box").forEach(function(box) {

        box.addEventListener("click", function() {
            const platform = this.dataset.platform;

            console.log("Opening " + platform);
        });

    });
</script>
